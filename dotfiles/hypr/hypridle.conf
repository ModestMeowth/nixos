general {
    lock_cmd = system-lock
    before_sleep_cmd = LOCK_ONLY=true system-lock
    after_sleep_cmd = sleep 1 && system-wake
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5min
    on-timeout = pidof hyprlock || launch-screensaver
}

listener {
    timeout = 302
    on-timeout = system-lock
    on-resume = system-wake
}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}
